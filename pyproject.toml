[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtualtissue-sc"
version = "0.5.0"
description = "Melanoma agent simulations from dissociated single-cell data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["PyYAML==6.0.3", "numpy==2.5.4", "scipy==1.18.1", "pandas==3.1.0", "anndata==0.13.4", "matplotlib==3.11.2"]

[project.optional-dependencies]
neutral = ["pyarrow==26.0.0"]
test = ["pytest==9.1.1"]
notebooks = ["ipykernel>=6.29,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "nbconvert>=7.16,<8"]
research = ["openpyxl==3.1.5", "pdfplumber>=0.11,<0.12"]
# single-cell input pipeline (scripts/sc_*.py); add liana for the preferred communication method
scrna = ["scanpy>=1.10", "harmonypy>=0.0.10", "leidenalg>=0.10", "igraph>=0.11", "scikit-misc>=0.3", "scikit-image>=0.22"]

[project.urls]
Repository = "https://github.com/hylixinsights/VirtualTissue-scRNAseq"
Issues = "https://github.com/hylixinsights/VirtualTissue-scRNAseq/issues"

[project.scripts]
vtsc = "vtsc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vtsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
